<div class="add-blanks">
    <h3 style="text-align: left; color: white;">{{ media_list_title }}</h3>
    {% for image in images_data %}
    <div class="media">
        <hr class="hr">
        <div class="media-left">
            <a href="{{ image.link }}" target="_blank">
                <img class="media-img media-object img-rounded" src="{{ image.image }}" alt="{{ image.alt }}">
            </a>
        </div>
        <div class="media-body">
            <a href="{{ image.link }}" target="_blank" style="color: white;">
                <u>
                    <div class="media-body">
                        <h4 class="text-left">{{ image.caption }}</h4>
                    </div>
                </u>
            </a>
            <p class="text-left truncate">{{ image.description }}</p>
        </div>
    </div>
    {% endfor %}
</div>
<script>
    var coll = document.getElementsByClassName("collapsible");
    var i;

    for (i = 0; i < coll.length; i++) {
        coll[i].addEventListener("click", function () {
            this.classList.toggle("active");
            var content = this.nextElementSibling;
            if (content.style.display === "block") {
                content.style.display = "none";
            } else {
                content.style.display = "block";
            }
        });
    }
</script>
